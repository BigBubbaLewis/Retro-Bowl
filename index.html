<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Play Retro Bowl, the original football game by New Star Games.">
    <title>Retro Bowl</title>
    <link rel="icon" href="img/icon.jpg">
    <style>
        html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        canvas { display: block; margin: 0; padding: 0; border: 0; image-rendering: pixelated; touch-action: none; }
        #gm4html5_div_id { margin: 0; padding: 0; border: 0; }
        :fullscreen #canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="Loading Retro Bowl" style="display:none">
        <canvas id="canvas" width="853" height="480">
            Your browser does not support HTML5 canvas.
        </canvas>
    </div>
    <script>
        // Keep the archived game script intact, including its trailing cpd expression.
        var cpd;
        // The original wrapper supports running without the optional hosting SDK.
        window.PokiSDK = null;
        window.PokiSDK_OK = false;
        window.PokiSDK_loadState = 0;
    </script>
    <script src="html5game/RetroBowl.js"></script>
    <script>window.addEventListener('load', GameMaker_Init);</script>
</body>
</html>
